# Runner configuration for the runner VM (ST78, FG-FR-15 MVP 2): a copy of compose/runner/config.yml
# (ST68) changed only at the network. No secret in this file: the registration lives in the
# data folder's .runner file.

log:
  level: info
  job_level: info

runner:
  file: .runner
  capacity: 1
  timeout: 1h
  fetch_interval: 2s
  labels:
    # The job image: the one pinned line. Workflows say `runs-on: mise`.
    - "mise:docker://jdxcode/mise:2026.11.9-debian"

  # An empty value: the runner makes a new network for each job. Jobs reach the forge at the forge URL (another VM), so no shared network.
  # Job containers use the VM's default Docker network; they reach the forge at ${FORGE_URL} (another VM), so no shared network.
  network: ""
  privileged: false
  force_pull: false

cache:
  enabled: false
