# Unbound for the core stack (ST178, CORE-FR-02 MVP 1; ST222, CORE-FR-10 MVP 2). Host network so the
# resolver binds CORE_LISTEN on the host (default 127.0.0.1): CORE_DNS_PORT (default 5353). The
# template unbound.conf gets its address, port, the internal zone's stub and CORE_LAN at start; the
# image's own unbound.sh keeps a config that already exists.
services:
  unbound:
    image: mvance/unbound:1.22.0
    container_name: core-unbound
    network_mode: host
    environment:
      - CORE_DNS_PORT=${CORE_DNS_PORT:-5353}
      - CORE_LISTEN=${CORE_LISTEN:-127.0.0.1}
      - CORE_BIND_PORT=${CORE_BIND_PORT:-5300}
      - CORE_LAN=${CORE_LAN:-}
    command:
      - sh
      - -c
      - 'stub="127.0.0.1@5300"; [ "$$CORE_LISTEN" = 127.0.0.1 ] || stub="$$CORE_LISTEN@$$CORE_BIND_PORT"; lan=""; [ -z "$$CORE_LAN" ] || lan="access-control: $$CORE_LAN allow"; sed -e "s/@ADDR@/$$CORE_LISTEN/" -e "s/@PORT@/$$CORE_DNS_PORT/" -e "s|@STUB@|$$stub|" -e "s|@LAN@|$$lan|" /etc/unbound/unbound.template > /opt/unbound/etc/unbound/unbound.conf && exec /unbound.sh'
    volumes:
      - ./unbound.conf:/etc/unbound/unbound.template:ro
    # The image's own check asks port 53; this one asks CORE_DNS_PORT on CORE_LISTEN.
    healthcheck:
      test: ["CMD-SHELL", "drill -p $$CORE_DNS_PORT @$$CORE_LISTEN nas.core.example A >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
