# Unbound for CORE-FR-02 MVP 1 (ST178). @PORT@ is replaced at start with
# CORE_DNS_PORT. Loopback only; validating; the fixture zone goes to BIND on
# 127.0.0.1:5300 (ST174).
server:
	# 127.0.0.1 and the port from CORE_DNS_PORT (the @ before @PORT@ is the port separator)
	interface: 127.0.0.1@@PORT@
	do-ip6: no
	access-control: 0.0.0.0/0 refuse
	access-control: 127.0.0.0/8 allow
	auto-trust-anchor-file: "var/root.key"
	# core.example is an internal zone with no DS in the root: not validated,
	# and BIND answers it.
	domain-insecure: "core.example"
	# the stub is BIND on this host: Unbound skips 127.0.0.0/8 by default
	do-not-query-localhost: no
	hide-identity: yes
	hide-version: yes

stub-zone:
	name: "core.example"
	stub-addr: 127.0.0.1@5300
