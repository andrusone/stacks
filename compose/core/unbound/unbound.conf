# Unbound for CORE-FR-02 MVP 1 (ST178) and CORE-FR-10 MVP 2 (ST222). The placeholders are replaced at
# start from the environment: @ADDR@ with CORE_LISTEN, @PORT@ with CORE_DNS_PORT, @STUB@ with the BIND
# address for the internal zone, @LAN@ with the CORE_LAN line (empty when CORE_LAN is unset).
# Validating; the fixture zone goes to BIND (ST174), on loopback unless CORE_LISTEN says otherwise.
server:
	# CORE_LISTEN and the port from CORE_DNS_PORT (the @ before @PORT@ is the port separator)
	interface: @ADDR@@@PORT@
	do-ip6: no
	access-control: 0.0.0.0/0 refuse
	access-control: 127.0.0.0/8 allow
	@LAN@
	auto-trust-anchor-file: "var/root.key"
	# core.example is an internal zone with no DS in the root: not validated,
	# and BIND answers it.
	domain-insecure: "core.example"
	# the stub is BIND on this host: Unbound skips 127.0.0.0/8 by default
	do-not-query-localhost: no
	hide-identity: yes
	hide-version: yes

stub-zone:
	name: "core.example"
	stub-addr: @STUB@
