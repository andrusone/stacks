# chrony for the core stack (ST176, CORE-FR-03 MVP 1). NTP on container UDP 123,
# CORE_NTP_PORT (default 12300) on the host, loopback only. The image is pinned by
# digest; its entrypoint is replaced so chrony.conf here is the config that runs.
services:
  chrony:
    image: dockurr/chrony:4.9@sha256:f584829f268b26b26b351000b60aa7c3507933873b6a6d77ffe9dcabcfdc7025
    container_name: core-chrony
    entrypoint: ["chronyd", "-x", "-n", "-f", "/etc/core-chrony/chrony.conf"]
    ports:
      - "${CORE_LISTEN:-127.0.0.1}:${CORE_NTP_PORT:-12300}:123/udp"
    volumes:
      - ./chrony.conf:/etc/core-chrony/chrony.conf:ro
    restart: unless-stopped
