# chrony for the core stack (ST176, CORE-FR-03 MVP 1).

# Upstream: the public pool. The server follows real time when the host reaches it.
pool 0.pool.ntp.org iburst
pool 1.pool.ntp.org iburst
pool 2.pool.ntp.org iburst
pool 3.pool.ntp.org iburst

# Until an upstream is synchronised, serve local time at stratum 10 so clients
# still get an answer. `chronyc tracking` shows the reference as LOCL until then.
local stratum 10

# Only the Docker networks may query: the bridge clients and the host port proxy.
allow 172.16.0.0/12

driftfile /var/lib/chrony/chrony.drift
