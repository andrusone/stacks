// BIND for CORE-FR-01 MVP 1 (ST174). Authoritative only: recursion is off.
options {
	directory "/var/cache/bind";
	recursion no;
	allow-query { any; };
	allow-transfer { none; };
	listen-on port 53 { any; };
	listen-on-v6 { none; };
};

zone "core.example" {
	type primary;
	file "/etc/bind/zone/db.fixture.zone";
};
