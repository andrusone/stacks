// BIND for CORE-FR-08 (ST213). This is the template: compose/core/bind/zone.sh writes
// named.generated.conf from it, with the role's lines in the zone. Recursion is off. Transfers are
// refused to everyone but the peer, by address only (no TSIG key yet).
options {
	directory "/var/cache/bind";
	recursion no;
	allow-query { any; };
	allow-transfer { none; };
	listen-on port 53 { any; };
	listen-on-v6 { none; };
};

// Transfers and their refusals go to the container log (docker logs), where the test reads them.
logging {
	channel to_stderr { stderr; severity info; print-time yes; };
	category xfer-out { to_stderr; };
	category xfer-in { to_stderr; };
	category security { to_stderr; };
};

zone "@ZONE_NAME@" {
@ROLE_LINES@
};
