# BIND for the core stack (ST174, CORE-FR-01 MVP 1; ST213, CORE-FR-08). Port 53 inside the
# container, CORE_BIND_PORT (default 5300) on the host, on CORE_LISTEN (default loopback). named.generated.conf is
# written by zone.sh from named.conf for CORE_ROLE (primary or secondary) before this comes up.
# The cache volume keeps a secondary's zone across restarts.
services:
  bind:
    image: internetsystemsconsortium/bind9:9.18
    container_name: core-bind
    ports:
      - "${CORE_LISTEN:-127.0.0.1}:${CORE_BIND_PORT:-5300}:53/udp"
      - "${CORE_LISTEN:-127.0.0.1}:${CORE_BIND_PORT:-5300}:53/tcp"
    volumes:
      - ./named.generated.conf:/etc/bind/named.conf:ro
      - ./zone:/etc/bind/zone:ro
      - core-bind-cache:/var/cache/bind
    restart: unless-stopped

volumes:
  core-bind-cache:
