[tools]
go = "1.26"
shellcheck = "0.11.0"

[tasks.check]
description = "The repo contract (D06): vet, test, the health files (HL-FR-06) and their generated Gatus config, and shellcheck on the monitor scripts"
run = ["go vet ./...", "go test ./...", "go run ./cmd/health check health", "go run ./cmd/health check health-test/probe", "go run ./cmd/health generate health", "go run ./cmd/health check health-starter", "bash compose/check-bundle-clone.sh", "shellcheck compose/up.sh compose/down.sh compose/prove.sh compose/forge/up.sh compose/forge/down.sh compose/forge/backup.sh compose/forge/restore.sh compose/runner/up.sh compose/runner/down.sh compose/forge/drill.sh compose/check-bundle-clone.sh setup.sh compose/forge-vm/setup.sh compose/runner-vm/setup.sh host/prepare.sh host/smoke.sh compose/core/up.sh compose/core/down.sh compose/core/prove.sh compose/core/bind/check.sh compose/core/bind/prove-zone.sh compose/core/bind/zone.sh compose/core-vm/test/bind-secondary.test.sh compose/core/chrony/prove-time.sh compose/core/unbound/prove-dns.sh qbt/ops/mullvad-health.sh qbt/ops/mullvad-relays.sh qbt/test/prove-rollover.sh qbt/test/stub/mullvad qbt/test/stub/curl plex/check-plex.sh compose/monitor/health-sync.sh compose/monitor/heartbeat.sh compose/monitor/backup.sh compose/monitor/host.sh compose/monitor/lan-prove.sh compose/monitor/test/host.test.sh", "bash compose/monitor/test/host.test.sh", "bash -n plex/check-plex.sh", "PYTHONPYCACHEPREFIX=${TMPDIR:-/tmp}/plex-pycache python3 -m py_compile plex/check-plex.py", "if command -v docker >/dev/null 2>&1; then mise run plex-config; else echo 'skipped plex-config: no docker'; fi"]

[tasks.monitor-up]
description = "Bring up the local monitor (Gatus, ntfy, two probes) with Docker"
run = "bash compose/up.sh"

[tasks.monitor-down]
description = "Remove the local monitor and everything it made"
run = "bash compose/down.sh"

[tasks.monitor-prove]
description = "Prove the alert path (ST59): break each answer, check the alert on the local topic, undo, check the recovery. Needs monitor-up"
run = "bash compose/prove.sh"

[tasks.forge-up]
description = "Bring up the local Forgejo (ST66): data in compose/forge/data, admin user on first run. Needs Docker"
run = "bash compose/forge/up.sh"

[tasks.forge-down]
description = "Remove the local Forgejo container and network; keeps the data folder"
run = "bash compose/forge/down.sh"

[tasks.forge-backup]
description = "Write a state-consistent copy of the local Forgejo (ST67) to the backup folder, keep the newest 7. Needs forge-up"
run = "bash compose/forge/backup.sh"

[tasks.forge-restore]
description = "Restore the local Forgejo (ST69) from the newest forge-*.zip in the backup folder into an empty data folder, then bring it up. Needs forge-down and an empty FORGE_DATA"
run = "bash compose/forge/restore.sh"

[tasks.forge-drill]
description = "The forge drills and the runner check in one run (ST71): reconnect, restore, then a green and a red runner check, one PASS or FAIL line per step. Needs Docker; works in a temp folder it removes"
run = "bash compose/forge/drill.sh"

[tasks.runner-up]
description = "Start the local Forgejo Actions runner (ST68): its own container, registered once to the forge. Needs forge-up"
run = "bash compose/runner/up.sh"

[tasks.runner-down]
description = "Remove the local runner container; keeps the data folder"
run = "bash compose/runner/down.sh"

[tasks.core-up]
description = "Bring up the core stack (ST174, CORE-FR-01): each compose/core/*/ check.sh, then its compose file. Zone fixture on BIND, CORE_BIND_PORT (default 5300). Needs Docker"
run = "bash compose/core/up.sh"

[tasks.core-down]
description = "Remove what core-up made: containers, networks and volumes of compose/core"
run = "bash compose/core/down.sh"

[tasks.core-prove]
description = "Run every compose/core prove-*.sh (ST174: zone answers from BIND). Needs core-up"
run = "bash compose/core/prove.sh"

[tasks.plex-config]
description = "Check the Plex and Kometa compose file (ST207, PLEX-FR-02 MVP 1): it renders with the pins in .env.example. Needs Docker; starts nothing"
run = "docker compose --env-file compose/plex/.env.example -f compose/plex/docker-compose.yml config --quiet && echo ok plex-config"

[tasks.plex-prove]
description = "Prove the moved plexcurator unit tests (ST206, PLEX-FR-01 MVP 1): the unchanged tests in plex/ with python3 unittest. No network; writes no bytecode"
run = 'cd plex && if out=$(PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -t . 2>&1); then echo "ok plex-prove $(printf "%s\n" "$out" | sed -n "s/^Ran \([0-9]*\) tests.*/\1/p") tests"; else printf "%s\n" "$out"; exit 1; fi'

[tasks.qbt-prove]
description = "Prove the Mullvad relay rollover (ST182, QBT-FR-02 MVP 1): the unchanged qbt/ops/mullvad-health.sh under mullvad and curl stubs in a temp folder it removes. No network"
run = "bash qbt/test/prove-rollover.sh"

[tasks.core-vm-test]
description = "Test compose/core-vm (ST212, CORE-FR-07 MVP 2): each compose/core-vm/test/*.test.sh, with a local bare repository and stubs; shellcheck of compose/core-vm/*.sh. No network"
run = "shellcheck compose/core-vm/*.sh && for t in compose/core-vm/test/*.test.sh; do bash \"$t\" || exit 1; done"

[tasks.monitor-test]
description = "Test the monitor's health sync (HL-FR-13, ST242, ST247) and outside heartbeat (HL-FR-09, ST256): compose/monitor/test/*.test.sh with a temp bare origin and stubs, and the timer installer with stubs and a temp etc folder; shellcheck of compose/monitor/health-sync.sh, health-sync-install.sh, heartbeat.sh and backup.sh. No network"
run = "shellcheck compose/monitor/health-sync.sh compose/monitor/health-sync-install.sh compose/monitor/heartbeat.sh compose/monitor/backup.sh compose/monitor/host.sh compose/monitor/lan-prove.sh && for t in compose/monitor/test/*.test.sh; do bash \"$t\" || exit 1; done"

[tasks.core-lan-prove]
description = "Prove a core node from a LAN client (ST215, CORE-FR-10 MVP 2): mise run core-lan-prove -- <core-ip> [--closed <port>...]. One ok or FAIL line per check; needs dig and nc, ntpdate optional. No changes on the node"
run = "bash compose/core-vm/lan-prove.sh"
